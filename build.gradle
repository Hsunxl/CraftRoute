plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group_id
// jar 名带 loader + MC 后缀：craftroute-<ver>_neoforge_1.21.1.jar
// （与 Forge 1.20.1 兄弟项目 craftroute-<ver>_forge_1.20.1.jar 命名风格一致）
version = "${mod_version}_neoforge_${minecraft_version}"


// 整合包实例的 mods 目录：默认 <项目>/../../../mods，可用 -PmodsDir=<绝对路径> 覆盖（CI / 另放的构建目录）。
def instanceMods = providers.gradleProperty('modsDir').getOrElse('../../../mods')

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    mods {
        craftroute {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    compileOnly files("${instanceMods}/ae2jeiintegration-1.2.1.jar")
    // Optional client integrations; supplied by the installed ATM10 instance.
    compileOnly files(providers.gradleProperty('jeiJar').getOrElse("${instanceMods}/jei-1.21.1-neoforge-19.57.0.446.jar"))
    compileOnly files(providers.gradleProperty('ae2ctJar').getOrElse("${instanceMods}/ae2ct-1.21.1-1.1.1.jar"))
    testRuntimeOnly files(providers.gradleProperty('jeiJar').getOrElse("${instanceMods}/jei-1.21.1-neoforge-19.57.0.446.jar"))
    testRuntimeOnly files(providers.gradleProperty('ae2ctJar').getOrElse("${instanceMods}/ae2ct-1.21.1-1.1.1.jar"))
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.5.3"
    // Thunderbolt-Core：可选前置，compileOnly。未安装也能正常运行；装了之后只有玩家
    // 用 /thunderbolt engine craftroute 选中本引擎，合成计算才会路由过来。
    compileOnly files(providers.gradleProperty('thunderboltJar').getOrElse("${instanceMods}/thunderbolt-2.0.1.jar"))

    testImplementation 'org.spongepowered:mixin:0.8.5'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

// Moddev 只把 moddev 生成的游戏类 + neoforge 依赖树注入 main 的编译/运行路径，
// 不注入 test。单元测试里的 VM 桥接基准（src/test/.../bench/）要离线驱动
// CraftingVM，需要 net.minecraft.* / com.mojang.*（DFU/brigadier 等），
// 因此把 main 的完整类路径接给 test。
afterEvaluate {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileTestJava') { dependsOn 'createMinecraftArtifacts' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // 打印 [reference-capability] 结果行到控制台（参考能力速度基准）
    testLogging {
        showStandardStreams = true
    }
}

// Correctness regression suite, explicitly separate from the upstream sub-microsecond timing assertions.
// The ordinary `test` task above is unchanged and still includes all benchmarks.
tasks.register('routeFunctionalTest', Test) {
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    jvmArgs '-Xverify:all'
    exclude '**/PerformanceBenchmark.class'
    // 已安装 jar 的契约测试要读整合包的 mods 目录（-PmodsDir 可覆盖）。
    systemProperty 'craftroute.modsDir', instanceMods
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8' // prevent non-ASCII corruption on Windows (GBK default)
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            minecraft_version      : minecraft_version,
            neoforge_version_range : neoforge_version_range,
            ae2_version_range      : ae2_version_range
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }

}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
        '-Amixin.refmap=craftroute.refmap.json'
    ]
}

// 把编好的 jar 复制进整合包的 mods 目录（显式任务，不挂 build）
// 复制前先删掉本模组的旧版本 jar；属性在 doLast 外捕获成局部变量
tasks.register('cleanOldJars') {
    def modsDir = java.nio.file.Path.of(instanceMods)
    def glob = "${mod_id}-*.jar"
    doLast {
        java.nio.file.Files.newDirectoryStream(modsDir, glob).withCloseable { stream ->
            stream.each { java.nio.file.Files.deleteIfExists(it) }
        }
    }
}

tasks.register('copyJarToMods', Copy) {
    dependsOn tasks.named('jar')
    dependsOn 'cleanOldJars'
    from tasks.named('jar').flatMap { it.archiveFile }
    into instanceMods
    doLast {
        logger.lifecycle("Copied JAR to mods folder")
    }
}

// 不把 copyJarToMods 挂在 build 上：往玩家实例的 mods 目录写文件应当是显式动作。
// 需要时手动执行 gradlew copyJarToMods，或用 buildBoth.bat。
